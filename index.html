<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15123b">
<meta name="description" content="Games Hub: original arcade and puzzle games for Telegram. Play, earn coins, climb levels.">
<title>Games Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script async src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>
<svg class="bgp" aria-hidden="true"><defs><pattern id="p" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="8" cy="10" r="1.6" fill="#fff" opacity=".18"/><circle cx="38" cy="40" r="1.2" fill="#ffc83d" opacity=".25"/><path d="M50 8l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#5cc8ff" opacity=".18"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>

<main id="home" class="scr on">
 <div class="hd">
  <svg viewBox="0 0 64 64"><rect x="4" y="16" width="56" height="34" rx="17" fill="#ffc83d"/><path d="M20 26v14M13 33h14" stroke="#15123b" stroke-width="4" stroke-linecap="round"/><circle cx="44" cy="29" r="4" fill="#ff6b4a"/><circle cx="51" cy="37" r="4" fill="#5cc8ff"/></svg>
  <div><h1>Games Hub</h1><p>Play and top the leaderboard</p></div>
  <button class="ib" id="lbBtn" aria-label="Leaderboard"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 01-10 0z"/><path d="M7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3M12 14v4M8 20h8"/></svg></button>
 </div>
 <div class="pf">
  <div class="lvb" id="lvb">1</div>
  <div class="pfm"><div class="pfn" id="pfn">You</div><div class="xp"><i id="xpf"></i></div><span id="xpt"></span></div>
  <div class="coin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc83d"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#b88a00" stroke-width="2"/></svg><b id="coins">0</b></div>
 </div>
 <div class="lv">
  <div class="lvl"><div class="hearts" id="hearts"></div><span id="lvs"></span></div>
  <button class="btn sm" id="adBtn"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>Watch ad +1</button>
 </div>
 <div class="chips">
  <button class="chip" id="bDaily"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M12 9c-3-5-7-3-5 0M12 9c3-5 7-3 5 0"/></svg>Daily<i class="dot" id="dDot"></i></button>
  <button class="chip" id="bBadge"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 21l5-3 5 3-1.5-7"/></svg>Badges</button>
  <button class="chip" id="bShop"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/></svg>Shop</button>
  <button class="chip q" id="bHelp" aria-label="How it works"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 015 .5c0 1.500-2.500 2-2.500 3.500M12 17v.1"/></svg></button>
 </div>
 <div class="grid" id="grid"></div>
</main>

<main id="play" class="scr">
 <div class="bar">
  <button class="ib" id="back" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h2 id="ttl"></h2>
  <button class="ib" id="mute" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg></button>
  <div class="pill"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z" fill="#ffc83d"/></svg><span id="sc">0</span></div>
 </div>
 <div class="stage">
  <canvas id="cv" width="360" height="480"></canvas>
  <div id="ov">
   <svg viewBox="0 0 64 64"><path d="M18 8h28v14a14 14 0 01-28 0z" fill="#ffc83d"/><path d="M18 12H8c0 10 4 15 11 16M46 12h10c0 10-4 15-11 16" fill="none" stroke="#ffc83d" stroke-width="4"/><rect x="28" y="36" width="8" height="10" fill="#ffc83d"/><rect x="20" y="46" width="24" height="8" rx="3" fill="#ff6b4a"/></svg>
   <h3 id="om"></h3><p id="os"></p><p id="orw"></p><p id="oc"></p>
   <button class="btn" id="again">Play again</button>
   <div class="orow"><button class="btn g" id="share">Share score</button><button class="btn g" id="menu">Menu</button></div>
  </div>
 </div>
 <div id="ctl"></div>
</main>

<main id="lb" class="scr">
 <div class="bar">
  <button class="ib" id="lbBack" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h2>Leaderboard</h2>
 </div>
 <p class="note">Sample players for now. Real rankings are coming soon.</p>
 <div class="tabs" id="tabs"></div>
 <div class="list" id="list"></div>
 <div id="mine"></div>
</main>

<div id="nl" class="modal"><div class="mbox">
 <svg viewBox="0 0 24 24"><path fill="#ff6b4a" d="M12 21C5 16 2 12.5 2 8.8 2 6 4.1 4 6.6 4c2 0 3.700 1 5.400 3 1.700-2 3.400-3 5.400-3C19.900 4 22 6 22 8.800 22 12.500 19 16 12 21z"/><path d="M13 5l-3 5 3 3-2 6" fill="none" stroke="#241f5e" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></svg>
 <h3>Out of lives</h3>
 <p id="nlt"></p>
 <button class="btn" id="nlAd">Watch ad for +1 life</button>
 <button class="btn g" id="nlShop">Buy with coins</button>
 <button class="btn g" id="nlX">Close</button>
</div></div>
<div id="md" class="modal"><div class="mbox" id="mdb"></div></div>
<div id="toast"></div>

<noscript>Games Hub needs JavaScript. Please open it inside Telegram.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
